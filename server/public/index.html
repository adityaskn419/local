<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0c0e; --panel:#141619; --panel2:#1a1d22; --raised:#20242b;
    --line:#23262d; --line2:#2f343d;
    --txt:#eceef1; --dim:#9ba3af; --faint:#5c636e;
    --accent:#7dd3a8; --accent-ink:#08110c;
    --blue:#7aa2f7; --amber:#e0b25a; --red:#e07a7a;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
    --ui:"Inter",system-ui,-apple-system,sans-serif;
    --r:9px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--txt);font-family:var(--ui);font-size:13px;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  ::selection{background:rgba(125,211,168,.25)}

  /* header */
  header{
    display:flex;align-items:center;gap:14px;padding:11px 16px;
    border-bottom:1px solid var(--line);background:linear-gradient(var(--panel),var(--panel));flex:none;
  }
  .brand{display:flex;align-items:baseline;gap:8px;font-weight:650;letter-spacing:-.015em}
  .brand .v{font-family:var(--mono);font-size:10px;color:var(--faint);font-weight:500;
    border:1px solid var(--line2);padding:1px 5px;border-radius:5px}
  .pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;
    color:var(--dim);padding:4px 10px;border:1px solid var(--line2);border-radius:20px;background:var(--panel2)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);transition:.2s}
  .dot.on{background:var(--accent);box-shadow:0 0 0 3px rgba(125,211,168,.15)}
  .dot.off{background:var(--red)}
  header .sp{flex:1}
  .gear{display:flex;align-items:center;gap:6px}
  input,button,select{font-family:var(--ui);font-size:12px;color:var(--txt);
    background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:7px 10px;outline:none}
  input::placeholder{color:var(--faint)}
  input:focus{border-color:var(--accent)}
  button{cursor:pointer;transition:background .12s,border-color .12s,transform .04s;user-select:none}
  button:hover{background:var(--raised);border-color:#3a4048}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
  button.primary:hover{background:#93dcb6}
  .gear input.tok{width:120px;font-family:var(--mono);font-size:11px}
  .gear input.dev{width:74px;font-family:var(--mono);font-size:11px}

  /* tabs */
  nav{display:flex;gap:2px;padding:10px 16px 0;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
  .tab{padding:8px 14px;font-size:12.5px;font-weight:500;color:var(--dim);border:none;background:none;
    border-bottom:2px solid transparent;border-radius:0;margin-bottom:-1px}
  .tab:hover{color:var(--txt);background:none}
  .tab.active{color:var(--txt);border-bottom-color:var(--accent)}

  main{flex:1;overflow-y:auto;padding:16px}
  main::-webkit-scrollbar{width:11px}
  main::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:3px solid var(--bg)}
  .view{display:none;max-width:960px;margin:0 auto}
  .view.active{display:block}

  /* control panels */
  .panels{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
  .card h3{margin:0 0 12px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--faint);font-weight:650;display:flex;align-items:center;gap:8px}
  .card h3 .hint{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:none;letter-spacing:0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row+.row{margin-top:10px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:8px 12px;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;
    font-size:12.5px;font-weight:500;flex:1;min-width:0;white-space:nowrap}
  .btn:hover{background:var(--raised)}
  .btn.wide{flex-basis:100%}
  .btn.warn{color:var(--amber)} .btn.danger{color:var(--red)}
  .icobtn{width:40px;height:38px;flex:none;display:grid;place-items:center;background:var(--panel2);
    border:1px solid var(--line2);border-radius:7px}
  .icobtn:hover{background:var(--raised)}
  .icobtn svg{width:17px;height:17px;stroke:var(--txt);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .icobtn.big{width:48px;height:44px}

  /* slider */
  .slider{display:flex;align-items:center;gap:11px}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--line2);
    border-radius:3px;flex:1;padding:0;border:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--accent);cursor:pointer;border:3px solid var(--panel)}
  .vval{font-family:var(--mono);font-size:12px;color:var(--dim);width:38px;text-align:right}

  /* segmented */
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:2px;width:100%}
  .seg button{flex:1;border:none;background:none;border-radius:6px;padding:7px 8px;font-size:12px;color:var(--dim)}
  .seg button:hover{background:var(--raised);color:var(--txt)}
  .seg button.sel{background:var(--raised);color:var(--txt);font-weight:600}

  /* readout */
  .readout{font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.7}
  .readout b{color:var(--txt);font-weight:500}
  .readout .k{color:var(--faint)}

  .miniform{display:flex;gap:8px}
  .miniform input{flex:1}

  /* apps */
  .apptools{display:flex;gap:10px;align-items:center;margin-bottom:14px}
  .searchbox{position:relative;flex:1}
  .searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);width:15px;height:15px}
  .searchbox input{width:100%;padding:9px 12px 9px 34px;background:var(--panel);border-radius:8px}
  .appcount{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
  .appgrid{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .app{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;cursor:pointer;position:relative;min-width:0}
  .app:hover{background:var(--panel2);border-color:var(--line2)}
  .app .av{width:28px;height:28px;flex:none;border-radius:7px;display:grid;place-items:center;
    font-family:var(--mono);font-weight:600;font-size:12px;color:#0a0a0a}
  .app .m{min-width:0;flex:1}
  .app .n{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app .p{font-family:var(--mono);font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app .x{position:absolute;right:5px;top:5px;width:19px;height:19px;border-radius:5px;display:none;
    place-items:center;color:var(--red);background:rgba(224,122,122,.12);font-size:13px}
  .app:hover .x{display:grid}.app .x:hover{background:rgba(224,122,122,.25)}
  .placeholder{color:var(--faint);text-align:center;padding:44px 0;line-height:1.7}
  .placeholder button{margin-top:6px}

  /* log */
  .logbar{flex:none;border-top:1px solid var(--line);background:var(--panel);display:flex;
    align-items:center;gap:10px;padding:7px 16px;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .logbar b{color:var(--txt);font-weight:500}.logbar .sp{flex:1}
  .logbar button{padding:3px 9px;font-size:11px}
  #log{flex:none;height:150px;overflow-y:auto;background:#08090b;font-family:var(--mono);font-size:11px;
    padding:8px 16px;border-top:1px solid var(--line);display:none}
  #log.open{display:block}
  #log .l{padding:1px 0;white-space:pre-wrap;word-break:break-word}
  #log .t{color:var(--faint)}.l .s{color:var(--blue)}.l .ok{color:var(--accent)}.l .bad{color:var(--red)}

  @media(max-width:560px){
    header{flex-wrap:wrap}.gear input.tok{width:90px}
    .appgrid{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<header>
  <div class="brand">Device Console <span class="v">remote</span></div>
  <div class="pill"><span class="dot" id="dot"></span><span id="stTxt">offline</span></div>
  <div class="sp"></div>
  <div class="gear">
    <input class="tok" id="token" type="password" placeholder="token" autocomplete="off" spellcheck="false">
    <input class="dev" id="deviceId" placeholder="device" spellcheck="false">
    <button class="primary" id="cbtn" onclick="connect()">Connect</button>
  </div>
</header>

<nav>
  <button class="tab active" data-v="controls" onclick="tab('controls')">Controls</button>
  <button class="tab" data-v="apps" onclick="tab('apps')">Apps</button>
</nav>

<main>
  <!-- CONTROLS -->
  <section class="view active" id="v-controls">
    <div class="panels">

      <div class="card">
        <h3>Sound</h3>
        <div class="row slider">
          <input type="range" id="vol" min="0" max="100" value="50" oninput="volLbl(this.value)" onchange="cmd('set_volume',{level:+this.value})">
          <span class="vval" id="volv">50%</span>
        </div>
        <div class="row">
          <button class="btn" onclick="cmd('volume_down')">− Vol</button>
          <button class="btn" onclick="cmd('volume_mute')">Mute</button>
          <button class="btn" onclick="cmd('volume_up')">+ Vol</button>
        </div>
        <div class="row" style="margin-top:12px">
          <div class="seg" id="ringer">
            <button onclick="ringer('ringer_normal',this)">Normal</button>
            <button onclick="ringer('ringer_vibrate',this)">Vibrate</button>
            <button onclick="ringer('ringer_silent',this)">Silent</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Media <span class="hint">now playing</span></h3>
        <div class="row" style="justify-content:center;gap:10px">
          <button class="icobtn" title="Previous" onclick="cmd('media_prev')"><svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
          <button class="icobtn big" title="Play / Pause" onclick="cmd('media_play_pause')"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
          <button class="icobtn" title="Next" onclick="cmd('media_next')"><svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
          <button class="icobtn" title="Stop" onclick="cmd('media_stop')"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
        </div>
      </div>

      <div class="card">
        <h3>Device</h3>
        <div class="row">
          <button class="btn" onclick="fetchInfo()">Refresh info</button>
          <button class="btn" onclick="cmd('vibrate',{ms:600})">Vibrate</button>
        </div>
        <div class="row">
          <button class="btn" onclick="cmd('flashlight_on')">Flash on</button>
          <button class="btn" onclick="cmd('flashlight_off')">Flash off</button>
        </div>
        <div class="readout" id="info" style="margin-top:12px">
          <span class="k">press “Refresh info”…</span>
        </div>
      </div>

      <div class="card">
        <h3>Find device</h3>
        <div class="row">
          <button class="btn warn wide" onclick="cmd('ring_device')">Ring at full volume</button>
        </div>
        <div class="row">
          <button class="btn wide" onclick="cmd('ring_stop')">Stop ringing</button>
        </div>
      </div>

      <div class="card">
        <h3>Send notification</h3>
        <div class="row miniform">
          <input id="ntitle" placeholder="title" value="Ping">
        </div>
        <div class="row miniform">
          <input id="ntext" placeholder="message">
          <button class="btn" style="flex:none" onclick="cmd('notify',{title:val('ntitle'),text:val('ntext')})">Send</button>
        </div>
      </div>

      <div class="card">
        <h3>Open URL</h3>
        <div class="row miniform">
          <input id="url" placeholder="example.com" onkeydown="if(event.key==='Enter')openUrl()">
          <button class="btn" style="flex:none" onclick="openUrl()">Open</button>
        </div>
      </div>

    </div>
  </section>

  <!-- APPS -->
  <section class="view" id="v-apps">
    <div class="apptools">
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" placeholder="Search installed apps…  (or type a full package)" spellcheck="false" oninput="renderApps()">
      </div>
      <button class="btn" style="flex:none" onclick="loadApps()">Reload</button>
      <span class="appcount" id="acount"></span>
    </div>
    <div class="appgrid" id="appgrid"></div>
  </section>
</main>

<div class="logbar">
  <b id="devlabel">no device</b><span>·</span><span id="counts">0 sent</span>
  <div class="sp"></div>
  <button onclick="toggleLog()" id="logtoggle">show log</button>
  <button onclick="clearLog()">clear</button>
</div>
<div id="log"></div>

<script>
const $=id=>document.getElementById(id);
let ws=null,connected=false,sent=0,apps=[],pending={};

/* config */
try{ $("token").value=localStorage.getItem("rc_token")||""; $("deviceId").value=localStorage.getItem("rc_dev")||"default"; }catch{}
function saveCfg(){try{localStorage.setItem("rc_token",$("token").value);localStorage.setItem("rc_dev",$("deviceId").value);}catch{}}
function val(id){return $(id).value;}

/* connection */
function setStatus(s){
  $("dot").className="dot "+(s==="online"?"on":s==="offline"||s==="disconnected"?"off":"");
  $("stTxt").textContent=s;
  $("devlabel").textContent=s==="online"?$("deviceId").value+" · online":"no device";
}
function connect(){
  saveCfg(); if(ws){try{ws.close()}catch{}}
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  setStatus("connecting");
  ws.onopen=()=>{connected=true;ws.send(JSON.stringify({type:"hello",role:"dashboard",token:$("token").value}));$("cbtn").textContent="Reconnect";log("connected to relay","t");};
  ws.onmessage=ev=>{
    const m=JSON.parse(ev.data);
    if(m.type==="agent_list")setStatus(m.devices.includes($("deviceId").value)?"online":"offline");
    if(m.type==="agent_status"&&m.deviceId===$("deviceId").value)setStatus(m.online?"online":"offline");
    if(m.type==="result"){ if(pending[m.requestId]){pending[m.requestId](m);delete pending[m.requestId];} else logResult(m); }
    if(m.type==="error")log("error: "+m.message,"bad");
  };
  ws.onclose=()=>{connected=false;setStatus("disconnected");};
  ws.onerror=()=>log("ws error","bad");
}
function cmd(action,args={},cb){
  if(!connected){log("not connected — hit Connect","bad");return;}
  const requestId=Math.random().toString(36).slice(2,10);
  if(cb)pending[requestId]=cb;
  ws.send(JSON.stringify({type:"command",deviceId:$("deviceId").value,requestId,action,args}));
  sent++;$("counts").textContent=sent+" sent";
  log("→ "+action+(args.package?" "+args.package:"")+(args.level!==undefined?" "+args.level:""),"s");
}

/* controls */
function volLbl(v){$("volv").textContent=v+"%";}
function ringer(action,btn){ [...$("ringer").children].forEach(b=>b.classList.remove("sel")); btn.classList.add("sel"); cmd(action); }
function openUrl(){ const u=val("url").trim(); if(u)cmd("open_url",{url:u}); }
function fetchInfo(){
  cmd("device_info",{},m=>{
    if(m.ok===false){$("info").innerHTML='<span class="bad">'+esc(m.error||"failed")+'</span>';return;}
    $("info").innerHTML=
      '<div><span class="k">model </span><b>'+esc(m.model||"?")+'</b></div>'+
      '<div><span class="k">android </span><b>'+esc(m.android||"?")+'</b> <span class="k">(sdk '+esc(String(m.sdk))+')</span></div>'+
      '<div><span class="k">battery </span><b>'+esc(String(m.battery))+'%</b></div>';
  });
}

/* apps */
function loadApps(){
  $("appgrid").innerHTML='<div class="placeholder">Loading installed apps from device…</div>';
  cmd("list_apps",{},m=>{
    if(m.ok===false||!m.apps){$("appgrid").innerHTML='<div class="placeholder">Couldn’t load apps.<br><button class="btn" onclick="loadApps()">Retry</button></div>';return;}
    apps=m.apps; try{localStorage.setItem("rc_apps",JSON.stringify(apps));}catch{}
    renderApps();
  });
}
function avColor(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return"hsl("+h+" 45% 62%)";}
function initials(n){const p=n.replace(/[^a-zA-Z0-9 ]/g,"").trim().split(/\s+/);return((p[0]?.[0]||"?")+(p[1]?.[0]||"")).toUpperCase();}
function renderApps(){
  const f=val("q").trim().toLowerCase();
  const grid=$("appgrid");
  if(!apps.length){
    grid.innerHTML='<div class="placeholder">No app list yet.<br>Load the apps actually installed on your phone.<br><button class="btn primary" onclick="loadApps()">Load installed apps</button></div>';
    $("acount").textContent="";return;
  }
  const list=apps.filter(a=>!f||a.name.toLowerCase().includes(f)||a.package.includes(f));
  $("acount").textContent=list.length+" / "+apps.length;
  grid.innerHTML="";
  if(f.includes(".")&&!list.some(a=>a.package===f)){
    grid.appendChild(appEl({name:"Launch package",package:f},true));
  }
  list.forEach(a=>grid.appendChild(appEl(a)));
  if(!list.length&&!f.includes("."))grid.innerHTML='<div class="placeholder">No match.</div>';
}
function appEl(a,custom){
  const el=document.createElement("div");el.className="app";
  el.innerHTML='<div class="av" style="background:'+(custom?"#7aa2f7":avColor(a.package))+'">'+esc(initials(a.name))+'</div>'+
    '<div class="m"><div class="n"></div><div class="p"></div></div><div class="x" title="Force-stop">×</div>';
  el.querySelector(".n").textContent=a.name;el.querySelector(".p").textContent=a.package;
  el.onclick=e=>{if(e.target.classList.contains("x"))return;cmd("launch_app",{package:a.package});};
  el.querySelector(".x").onclick=e=>{e.stopPropagation();cmd("kill_app",{package:a.package});};
  return el;
}
try{const c=localStorage.getItem("rc_apps");if(c)apps=JSON.parse(c);}catch{}

/* tabs */
function tab(v){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.v===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("active",s.id==="v-"+v));
  if(v==="apps")renderApps();
}

/* log */
function log(t,c=""){const el=$("log");const r=document.createElement("div");r.className="l";
  r.innerHTML='<span class="t">'+new Date().toLocaleTimeString([],{hour12:false})+'</span> <span class="'+c+'">'+esc(t)+'</span>';
  el.appendChild(r);el.scrollTop=el.scrollHeight;}
function logResult(m){const ok=m.ok!==false;let x="";
  if(m.percent!==undefined)x=" "+m.percent+"% "+(m.charging?"(charging)":"");
  if(m.level!==undefined)x=" → "+m.level+"%";
  if(m.error)x=" "+m.error; if(m.note)x+="  · "+m.note;
  log("← "+(m.action||"result")+(ok?" ok":" fail")+x,ok?"ok":"bad");}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function toggleLog(){const l=$("log");l.classList.toggle("open");$("logtoggle").textContent=l.classList.contains("open")?"hide log":"show log";}
function clearLog(){$("log").innerHTML="";}

/* init */
setStatus("disconnected");renderApps();
if($("token").value)connect();
</script>
</body>
</html>
